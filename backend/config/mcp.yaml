# MCP (Model Context Protocol) 配置
# use_mcp: 是否启用 MCP 模式（true 使用 MCP Client 连接，false 使用原有直连）
use_mcp: false

# MCP Server 连接配置
# 每个 server 支持两种类型：
#   type: stdio - 本地子进程，通过标准输入输出通信（单机推荐）
#   type: sse - 远程服务，通过 SSE over HTTP 通信（分布式推荐）
mcp:
  postgres:
    # 示例：stdio 模式（官方 npx 直接运行）
    type: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-postgres"
      - "${PG_DATABASE_URL}"
    # api_key 不需要（stdio 本地不需要认证）

    # 示例：sse 模式（独立部署）
    # type: sse
    # url: "http://mcp-postgres:8001/sse"
    # api_key: "${MCP_POSTGRES_API_KEY}"

  elasticsearch:
    # 示例：stdio 模式（本地子进程运行我们自建的 Python 服务）
    type: stdio
    command: python
    args:
      - -m
      - mcp_elasticsearch
      - --transport
      - stdio
      - --url
      - "${ELASTICSEARCH_URL}"

    # 示例：sse 模式（独立部署）
    # type: sse
    # url: "http://mcp-elasticsearch:8002/sse"
    # api_key: "${MCP_ELASTICSEARCH_API_KEY}"
